<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Kailash E-Store</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        .errors {
            color: #dc2626;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<div class="auth-wrapper">

    <div class="auth-card">

        <h1>Create Your Account</h1>

        <div class="subtitle">
            Join Kailash E-Store today
        </div>

        {% if form.non_field_errors %}
            <div class="errors">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login-link">

            Already have an account?

            <a href="{% url 'accounts:login' %}">
                Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
