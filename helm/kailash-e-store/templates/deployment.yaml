apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "kailash-e-store.fullname" . }}
  labels:
    app: {{ include "kailash-e-store.name" . }}

spec:
  replicas: {{ .Values.replicaCount }}

  revisionHistoryLimit: 5

  progressDeadlineSeconds: 600

  selector:
    matchLabels:
      app: {{ include "kailash-e-store.name" . }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: {{ include "kailash-e-store.name" . }}

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: django

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: DJANGO_DEBUG
              value: "{{ .Values.env.DJANGO_DEBUG }}"

            - name: DJANGO_ALLOWED_HOSTS
              value: "{{ .Values.env.DJANGO_ALLOWED_HOSTS }}"

          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5

          resources:
{{ toYaml .Values.resources | nindent 12 }}