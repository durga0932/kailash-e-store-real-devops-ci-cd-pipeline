# ============================================================
# KAILASH E-STORE - ANSIBLE OPERATIONS
# ============================================================
# Jenkins is the controller.
# EC2 targets are reached using AWS SSM.
#
# This playbook:
# 1. Configures Jenkins CI/CD controller
# 2. Verifies required CI/CD tools
# 3. Configures SonarQube server
#
# IMPORTANT:
# Jenkins is NOT restarted by this playbook.
# Jenkins Docker-group configuration/restart is handled
# during the Jenkins bootstrap process.
# ============================================================


# ============================================================
# 1. JENKINS CI/CD CONTROLLER
# ============================================================

- name: Configure Jenkins CI/CD controller
  hosts: jenkins
  become: true

  tasks:

    # --------------------------------------------------------
    # Base operational packages
    # --------------------------------------------------------

    - name: Install Jenkins operational packages
      ansible.builtin.apt:
        name:
          - ansible
          - jq
          - unzip
          - curl
          - git
          - wget
          - gnupg
          - python3-docker
        state: present
        update_cache: true


    # --------------------------------------------------------
    # Python tooling for Django / CI tasks
    # --------------------------------------------------------

    - name: Install Python build tooling
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-pip
        state: present


    # --------------------------------------------------------
    # Docker access for Jenkins
    # --------------------------------------------------------
    # Do not restart Jenkins here.
    # Jenkins bootstrap is responsible for applying the
    # Docker group membership to the Jenkins service.

    - name: Ensure Docker group exists
      ansible.builtin.group:
        name: docker
        state: present


    - name: Add Jenkins to Docker group
      ansible.builtin.user:
        name: jenkins
        groups:
          - docker
        append: true


    # --------------------------------------------------------
    # Verify Jenkins service
    # --------------------------------------------------------

    - name: Ensure Jenkins is enabled and running
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: started


    # --------------------------------------------------------
    # Verify Docker
    # --------------------------------------------------------

    - name: Verify Docker is installed
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false


    - name: Display Docker version
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"


    # --------------------------------------------------------
    # Verify Terraform
    # --------------------------------------------------------

    - name: Verify Terraform is installed
      ansible.builtin.command:
        cmd: terraform version
      register: terraform_version
      changed_when: false


    - name: Display Terraform version
      ansible.builtin.debug:
        msg: "{{ terraform_version.stdout }}"


    # --------------------------------------------------------
    # Verify Helm
    # --------------------------------------------------------

    - name: Verify Helm is installed
      ansible.builtin.command:
        cmd: helm version --short
      register: helm_version
      changed_when: false


    - name: Display Helm version
      ansible.builtin.debug:
        msg: "{{ helm_version.stdout }}"


    # --------------------------------------------------------
    # Verify kubectl
    # --------------------------------------------------------

    - name: Verify kubectl is installed
      ansible.builtin.command:
        cmd: kubectl version --client=true --output=yaml
      register: kubectl_version
      changed_when: false


    - name: Display kubectl version
      ansible.builtin.debug:
        msg: "{{ kubectl_version.stdout }}"


    # --------------------------------------------------------
    # Verify Trivy
    # --------------------------------------------------------

    - name: Verify Trivy is installed
      ansible.builtin.command:
        cmd: trivy --version
      register: trivy_version
      changed_when: false


    - name: Display Trivy version
      ansible.builtin.debug:
        msg: "{{ trivy_version.stdout }}"


    # --------------------------------------------------------
    # Verify AWS CLI
    # --------------------------------------------------------

    - name: Verify AWS CLI is installed
      ansible.builtin.command:
        cmd: aws --version
      register: aws_version
      changed_when: false


    - name: Display AWS CLI version
      ansible.builtin.debug:
        msg: "{{ aws_version.stderr if aws_version.stderr else aws_version.stdout }}"


    # --------------------------------------------------------
    # Verify Git
    # --------------------------------------------------------

    - name: Verify Git is installed
      ansible.builtin.command:
        cmd: git --version
      register: git_version
      changed_when: false


    - name: Display Git version
      ansible.builtin.debug:
        msg: "{{ git_version.stdout }}"


# ============================================================
# 2. SONARQUBE SERVER
# ============================================================

- name: Configure SonarQube server
  hosts: sonarqube
  become: true

  tasks:

    # --------------------------------------------------------
    # Docker installation
    # --------------------------------------------------------

    - name: Ensure Docker is installed
      ansible.builtin.apt:
        name:
          - docker.io
        state: present
        update_cache: true


    # --------------------------------------------------------
    # Docker service
    # --------------------------------------------------------

    - name: Enable Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started


    # --------------------------------------------------------
    # Ensure SonarQube volumes exist
    # --------------------------------------------------------

    - name: Create SonarQube data volume
      community.docker.docker_volume:
        name: sonarqube_data
        state: present


    - name: Create SonarQube logs volume
      community.docker.docker_volume:
        name: sonarqube_logs
        state: present


    - name: Create SonarQube extensions volume
      community.docker.docker_volume:
        name: sonarqube_extensions
        state: present


    # --------------------------------------------------------
    # SonarQube container
    # --------------------------------------------------------

    - name: Ensure SonarQube container is running
      community.docker.docker_container:
        name: sonarqube
        image: sonarqube:lts-community
        state: started
        restart_policy: unless-stopped

        published_ports:
          - "9000:9000"

        volumes:
          - "sonarqube_data:/opt/sonarqube/data"
          - "sonarqube_logs:/opt/sonarqube/logs"
          - "sonarqube_extensions:/opt/sonarqube/extensions"


    # --------------------------------------------------------
    # Wait for SonarQube
    # --------------------------------------------------------

    - name: Wait for SonarQube HTTP endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:9000/api/system/status
        method: GET
        status_code: 200

      register: sonar_status

      retries: 30
      delay: 10

      until: sonar_status.status == 200


    # --------------------------------------------------------
    # Display SonarQube status
    # --------------------------------------------------------

    - name: Display SonarQube status
      ansible.builtin.debug:
        msg: "SonarQube is responding on HTTP port 9000"