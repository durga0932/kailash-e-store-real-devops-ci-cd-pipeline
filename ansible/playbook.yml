---
# ============================================================
# KAILASH E-STORE - ANSIBLE OPERATIONS
# Jenkins is the controller; EC2 targets are reached using AWS SSM.
# ============================================================

- name: Configure Jenkins CI/CD controller
  hosts: jenkins
  become: true
  tasks:
    - name: Install Jenkins operational packages
      ansible.builtin.apt:
        name:
          - ansible
          - jq
          - unzip
          - curl
          - git
          - wget
          - gnupg
          - python3-docker
        state: present
        update_cache: true

    - name: Install Python build tooling
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-pip
        state: present

    - name: Add Jenkins to Docker group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true

    - name: Verify Terraform is installed
      ansible.builtin.command: terraform version
      register: terraform_version
      changed_when: false

    - name: Verify Helm is installed
      ansible.builtin.command: helm version --short
      register: helm_version
      changed_when: false

    - name: Verify kubectl is installed
      ansible.builtin.command: kubectl version --client=true --output=yaml
      register: kubectl_version
      changed_when: false

    - name: Verify Trivy is installed
      ansible.builtin.command: trivy --version
      register: trivy_version
      changed_when: false

    - name: Ensure Jenkins is enabled and running
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: started

- name: Configure SonarQube server
  hosts: sonarqube
  become: true
  tasks:
    - name: Ensure Docker is installed and running
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Enable Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Ensure SonarQube container is running
      community.docker.docker_container:
        name: sonarqube
        image: sonarqube:lts-community
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "9000:9000"
        volumes:
          - "sonarqube_data:/opt/sonarqube/data"
          - "sonarqube_logs:/opt/sonarqube/logs"
          - "sonarqube_extensions:/opt/sonarqube/extensions"

    - name: Wait for SonarQube HTTP endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:9000/api/system/status
        method: GET
        status_code: 200
      register: sonar_status
      retries: 30
      delay: 10
      until: sonar_status.status == 200
