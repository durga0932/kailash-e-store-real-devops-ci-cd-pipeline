# Generated automatically by Jenkins from Terraform outputs.
# ansible_host is an EC2 INSTANCE ID; Ansible uses AWS SSM.

[jenkins]
jenkins-host ansible_host=JENKINS_INSTANCE_ID

[sonarqube]
sonarqube-host ansible_host=SONARQUBE_INSTANCE_ID

[all:vars]
ansible_connection=amazon.aws.aws_ssm
ansible_aws_ssm_region=ap-south-1
ansible_python_interpreter=/usr/bin/python3
